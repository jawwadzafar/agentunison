harness: copilot
displayName: GitHub Copilot (coding agent / CLI / VS Code)
versionsVerified: []
detect:
  binaries: [copilot]
  versionArgs: ["--version"]
  projectDirs: [.github/agents, .github/skills, .github/instructions, .github/prompts, .github/hooks]
  files: [.github/copilot-instructions.md]
surfaces:
  instructions:
    root: [AGENTS.md, .github/copilot-instructions.md]
    nestedName: AGENTS.md
    alsoReadsLiteral: [CLAUDE.md, GEMINI.md]
  skills:
    dirs: [.github/skills, .agents/skills, .claude/skills]
  agents:
    dirs: [.github/agents]
    format: copilot-agent-md
  rules:
    dirs: [.github/instructions]
  hooks:
    dirs: [.github/hooks]
instructions:
  readsAgentsMd: { value: true, evidence: doc, checkedOn: 2026-09-04, note: "cloud agent root+nested; CLI root/cwd; VS Code root" }
  importSyntax: { value: null, evidence: doc, checkedOn: 2026-09-04 }
  followsSymlink: { value: null, evidence: none, checkedOn: 2026-09-04, note: "undocumented; breakage reports" }
  copilotInstructionsAlsoReadBy: "Copilot Chat surfaces that do not read AGENTS.md (github.com, JetBrains, Xcode, Eclipse)"
skills:
  readsCanonical: { value: true, evidence: doc, checkedOn: 2026-09-04 }
  readsClaudeSkills: { value: true, evidence: doc, checkedOn: 2026-09-04 }
  followsDirSymlink: { value: null, evidence: none, checkedOn: 2026-09-04 }
  followsEntrySymlink: { value: null, evidence: none, checkedOn: 2026-09-04 }
  dedup: unknown
verify:
  live:
    kind: list-skills
    command: [copilot, skill, list]
    timeoutMs: 45000
    cost: none
