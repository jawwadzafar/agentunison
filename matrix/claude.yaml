# Capability matrix — Claude Code. Every fact carries evidence (doc|bin|test), the date it was
# checked, and the versions/platforms it was verified on. Unknown ⇒ AgentUnison takes the
# conservative branch. Sources: research/harness-docs-claude-codex-opencode.md
harness: claude
displayName: Claude Code
versionsVerified: ["2.1.259"]
detect:
  binaries: [claude]
  versionArgs: ["--version"]
  projectDirs: [.claude]
  files: [CLAUDE.md, CLAUDE.local.md]
surfaces:
  instructions:
    root: [CLAUDE.md, .claude/CLAUDE.md, CLAUDE.local.md]
    nestedName: CLAUDE.md
  skills:
    dirs: [.claude/skills]
  commands:
    dirs: [.claude/commands]
    legacy: true
  agents:
    dirs: [.claude/agents]
    format: claude-md
  rules:
    dirs: [.claude/rules]
  settings:
    files: [.claude/settings.json, .claude/settings.local.json, .claude/launch.json]
instructions:
  readsAgentsMd: { value: false, evidence: doc, checkedOn: 2026-09-04, note: "official interop is @AGENTS.md import or symlink" }
  importSyntax: { value: "@{path}", example: "@AGENTS.md", maxDepth: 4, evidence: test, checkedOn: 2026-09-04, platforms: [posix], note: "fixture: secret phrase from AGENTS.md returned through the @AGENTS.md shim" }
  followsSymlink: { value: true, evidence: test, checkedOn: 2026-09-04, platforms: [posix] }
  lineBudget: 200
  shimSafeWhenLiteral: true
skills:
  readsCanonical: { value: false, evidence: bin, checkedOn: 2026-09-04, note: "no .agents/skills discovery; feature request open" }
  followsDirSymlink: { value: true, evidence: test, checkedOn: 2026-09-04, platforms: [posix] }
  followsEntrySymlink: { value: true, evidence: test, checkedOn: 2026-09-04, platforms: [posix] }
  dedup: none
  extraFrontmatter: [disable-model-invocation, user-invocable, allowed-tools, model, context, agent, hooks, paths, argument-hint]
verify:
  live:
    kind: claude-debug
    timeoutMs: 180000
    cost: api-call
